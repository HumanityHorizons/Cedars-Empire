name: Python syntax check
on:
  push:
    branches: [main, cedars-empire-test]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application modules
        run: python -m py_compile app.py hh_workspace_widgets.py cedars_treasury_model.py hh_real_payments.py hh_table_ui.py hh_grid_marketplace.py hh_robot_dashboard.py hh_robotics.py

  robot-grid-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pandas streamlit
      - name: Test grid registry, dashboard theme and robot safety state machine
        run: python -m pytest -q tests/test_robotics.py tests/test_grid_marketplace.py tests/test_navigation_inventory.py tests/test_dashboard_theme.py tests/test_grid_readiness.py tests/test_site_assembly_plan.py tests/test_auth_session_guards.py
