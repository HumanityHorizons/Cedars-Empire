name: Daily crediting safety checks
on:
  push:
    branches:
      - fix/durable-storage-and-login
  pull_request:
    branches:
      - main
jobs:
  test-daily-crediting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run daily crediting tests
        run: python -m unittest discover -s tests -p "test_daily_crediting.py" -v
      - name: Compile Python modules
        run: python -m py_compile app.py daily_crediting.py
