name: Live app grid and calendar checks

on:
  push:
    branches:
      - main
      - feature/live-action-grids-calendar-reminders
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile live application
        run: python -m py_compile app.py hh_workspace_widgets.py cedars_treasury_model.py hh_real_payments.py hh_table_ui.py
      - name: Verify action grids and exports
        run: pytest -q tests/test_live_workspace_widgets.py
      - name: Verify treasury model formulas and workbook export
        run: pytest -q tests/test_cedars_treasury_model.py tests/test_hh_real_payments.py tests/test_table_ui.py
