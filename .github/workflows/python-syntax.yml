name: Python syntax check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile application modules and run grid tests
        run: python -m py_compile app.py hh_workspace_widgets.py cedars_treasury_model.py hh_real_payments.py hh_table_ui.py hh_grid_marketplace.py hh_robotics.py hh_robot_dashboard.py && python -m pytest -q tests/test_robotics.py tests/test_grid_marketplace.py
