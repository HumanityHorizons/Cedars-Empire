name: Humanity Horizons scheduled reports
on:
  schedule:
    - cron: "0 6 25 * *" # Runs on the 25th monthly at 06:00 UTC; script filters quarterly/annual schedules.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report-job dependencies
        run: python -m pip install "psycopg[binary]>=3.2"
      - name: Generate and email scheduled reports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: python scheduled_reports.py
