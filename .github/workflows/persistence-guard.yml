name: Persistence safety checks

on:
  push:
    branches: [main, fix/durable-storage-and-login]
  pull_request:
    branches: [main]

jobs:
  persistence-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application and modules
        run: python -m compileall -q app.py streamlit_app.py hh_real_payments.py hh_workspace_widgets.py hh_table_ui.py
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run persistence safety checks
        run: python -m pytest -q tests
